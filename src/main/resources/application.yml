spring:
  application:
    name: inventory-billing-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/inventory}
    username: ${DB_USER:inventory}
    password: ${DB_PASSWORD:inventory}
  jpa:
    hibernate:
      ddl-auto: validate      # Flyway owns the schema; Hibernate only checks it
    open-in-view: false
  flyway:
    enabled: true
server:
  error:
    include-message: always
management:
  endpoints:
    web:
      exposure:
        include: health,info